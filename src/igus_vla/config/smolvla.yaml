# =============================================================================
# config/smolvla.yaml — Hyperparamètres SmolVLA (§1, §3.1, §9)
# Utilisé par : scripts/train_smolvla.sh, vla_policy_node
# =============================================================================

# --- Modèle de base ---
# Type de politique construit À PARTIR du dataset (features dérivées : 1 caméra
# "front" + state/action dim 7). À privilégier pour NOTRE robot.
policy_type: "smolvla"

# Charger les poids pré-entraînés du backbone vision-langage SmolVLM2 (~500 M).
# true = on profite du pré-entraînement VLM (seul l'expert d'action est appris).
load_vlm_weights: true

# (Avancé / NON utilisé par défaut) Fine-tuning depuis le checkpoint robotique
# complet `lerobot/smolvla_base` : INCOMPATIBLE tel quel avec notre embodiment
# (il impose 3 caméras camera1/2/3 + dim 6). Nécessiterait un --rename_map et la
# gestion des caméras manquantes. Conservé ici pour mémoire.
policy_path: "lerobot/smolvla_base"

# --- Dispositif d'inférence/entraînement ---
# auto  → détecte torch.cuda.is_available() (bascule GPU/CPU automatiquement)
# cpu   → forcer CPU (i7-14700K, sans GPU — pour smoke test et validation)
# cuda  → forcer GPU (après achat ; aucun autre fichier à modifier — §9)
device: "cpu"

# --- Paramètres d'entraînement ---
# batch_size :
#   1 (smoke test CPU, valeur actuelle)
#   32–64 (entraînement complet GPU — changer ici uniquement)
batch_size: 1

# steps :
#   5 (smoke test CPU — prouve imports + schéma + loss)
#   20000 (entraînement complet — §8, ~4 h sur A100)
steps: 5

# Mixed precision (AMP) — désactiver sur CPU (non supporté), activer avec cuda
amp: false

# --- Logging Weights & Biases ---
# Activer avec wandb_enable: true + WANDB_API_KEY dans .env
wandb_enable: false
# wandb_project: igus_vla
# wandb_entity:

# --- Chunking (§3.1) ---
# Nombre d'actions prédites par passe SmolVLA (chunk)
chunk_size: 50
# Nombre de pas d'actions exécutés par chunk (receding horizon)
n_action_steps: 50

# --- Répertoires de sortie ---
# Checkpoints produits par lerobot-train
output_dir: "outputs/train/igus_vla_smolvla"

# --- Paramètres du nœud politique (vla_policy_node) ---
# Fréquence de la boucle de contrôle (Hz) — doit correspondre au dataset fps
control_hz: 15

# Seuil de décision pince : action[6] > gripper_threshold → fermer
gripper_threshold: 0.5
