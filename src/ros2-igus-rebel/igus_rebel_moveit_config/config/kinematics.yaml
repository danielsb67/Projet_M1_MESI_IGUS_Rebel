# chain for the robot arm
rebel_arm:
    kinematics_solver: trac_ik_kinematics_plugin/TRAC_IKKinematicsPlugin
    kinematics_solver_search_resolution: 0.005
    kinematics_solver_timeout: 0.5
    solve_type: Distance
    # position_only_ik: false → l'orientation envoyée dans la requête IK
    # est respectée. Permet de figer la pince verticale (pointing-down) via
    # le quaternion DOWNWARD_QUAT dans pick_place_ia.py.
    # Si remis à true : TRAC-IK ignore l'orientation, joint5 libre.
    position_only_ik: true
    # Repli KDL si TRAC-IK n'est pas buildé :
    # kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
    # alternative inverse kinematics solver
    # kinematics_solver: pick_ik/PickIkPlugin
    # kinematics_solver_timeout: 0.01
    # kinematics_solver_attempts: 10000
    # mode: global
    # position_scale: 1.0
    # rotation_scale: 0.5
    # position_threshold: 0.0005
    # orientation_threshold: 0.001
